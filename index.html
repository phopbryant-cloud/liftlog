<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0c0a12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LIFTLOG" />
  <title>LIFTLOG</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">LIFT<span>LOG</span><small>Import · Track · Progress</small></div>
  </header>

  <main>
    <section id="screen-templates" class="screen active"></section>
    <section id="screen-import" class="screen"></section>
    <section id="screen-preview" class="screen"></section>
    <section id="screen-rest" class="screen"></section>
    <section id="screen-session" class="screen"></section>
    <section id="screen-history" class="screen"></section>
    <section id="screen-settings" class="screen"></section>
  </main>

  <nav class="nav">
    <a href="#" data-screen="templates" class="active"><span class="ico">▤</span>Templates</a>
    <a href="#" data-screen="import"><span class="ico">＋</span>Import</a>
    <a href="#" data-screen="history"><span class="ico">◷</span>History</a>
    <a href="#" data-screen="settings"><span class="ico">⚙</span>Settings</a>
  </nav>

  <script src="./js/parser.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/bell.js"></script>
  <script src="./js/session.js"></script>
  <script src="./js/history.js"></script>
  <script src="./js/settings.js"></script>
  <script src="./js/app.js"></script>

  <script>
    // Boot guard. A <script> that fails to load throws no JS error, so a single
    // missing file leaves the app half-alive: nav items that do nothing, a
    // workout that will not resume. Seen in the wild from a stale/poisoned
    // service-worker cache, and it is undebuggable on a phone. Detect it and
    // self-heal. Caches are cleared; localStorage (all workout data) is not.
    (function () {
      var REQUIRED = ['WorkoutParser', 'Store', 'Bell', 'Session', 'History', 'Settings', 'App'];
      var missing = REQUIRED.filter(function (n) { return !window[n]; });
      if (!missing.length) return;

      function heal() {
        var done = function () { location.reload(); };
        var jobs = [];
        try {
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }));
          }
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
          Promise.all(jobs).then(done, done);
          setTimeout(done, 2500); // never hang on a wedged SW
        } catch (e) { done(); }
      }

      document.body.innerHTML =
        '<div style="padding:32px 20px;font-family:system-ui,-apple-system,sans-serif;color:#e8e4f0">' +
        '<h2 style="font-family:Anton,sans-serif;text-transform:uppercase;font-size:22px;margin:0 0 12px">Reloading app</h2>' +
        '<p style="font-size:14px;line-height:1.55;color:#a99fbd;margin:0">Some files did not load (' +
        missing.join(', ') + '). Clearing the cache and retrying.<br><br>' +
        '<strong style="color:#fdb927">Your workouts and history are safe</strong> — this only clears cached code.</p>' +
        '<button id="liftlog-heal" style="margin-top:22px;width:100%;min-height:52px;border-radius:12px;' +
        'border:1px solid #a855f7;background:#7c3aed;color:#fff;font-size:15px;font-weight:700">Reload now</button>' +
        '</div>';
      document.getElementById('liftlog-heal').onclick = heal;

      // Auto-heal once per tab, then leave it to the button so a persistent
      // failure cannot become a reload loop.
      try {
        if (!sessionStorage.getItem('liftlog-healed')) {
          sessionStorage.setItem('liftlog-healed', '1');
          heal();
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
